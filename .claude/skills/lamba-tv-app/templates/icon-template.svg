<!-- Lamba app icon template: the icon standard (https://lamba.tv/devs/docs/assets/#required-the-icon), drawn in layers.
     Copy it to my-app/icon.svg and draw YOUR app's scene in the same layers. A square; Lamba rounds the corners (about 22%).
       1. the background: a gradient that fills the whole square, edge to edge (light from the top, deeper at the bottom);
       2. a soft glow behind the subject, so it stands out;
       3. ONE descriptive scene or object that says what the app does at a glance (here: a calm sea at sunrise), with its own gradient;
       4. soft light and shadow: a highlight on top, a soft shadow or reflection under it;
       5. two or three colours that sit well together (here: sea teal and sun gold), shades of each are fine.
     No words, letters, numbers or emoji. Keep the important parts inside the middle 80% (12 to 108). Lines at least 2 wide.
     Look at it small: node lamba-icon.mjs --look my-app. At 48 px you must still see what it is. Under 50 KB (a drawn icon is usually 2 to 6 KB). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fcfc8"/><stop offset=".55" stop-color="#ffdca0"/><stop offset="1" stop-color="#ffc27a"/></linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f8fa3"/><stop offset="1" stop-color="#123f57"/></linearGradient>
<radialGradient id="sun" cx="42%" cy="35%" r="70%"><stop offset="0" stop-color="#fffbe6"/><stop offset=".55" stop-color="#ffd66b"/><stop offset="1" stop-color="#ffa23c"/></radialGradient>
<filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="120" height="120"><feGaussianBlur stdDeviation="9"/></filter>
<filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="120" height="120"><feGaussianBlur stdDeviation="2"/></filter>
<clipPath id="up"><rect width="120" height="68"/></clipPath>
</defs>
<!-- 1. the background, edge to edge -->
<rect width="120" height="120" fill="url(#sky)"/>
<!-- 2. the glow behind the subject -->
<circle cx="60" cy="62" r="30" fill="#ffd66b" opacity=".7" filter="url(#glow)"/>
<!-- 3. the subject: the sun rising from the sea -->
<g clip-path="url(#up)"><circle cx="60" cy="66" r="24" fill="url(#sun)"/></g>
<rect y="66" width="120" height="54" fill="url(#sea)"/>
<!-- 4. light and shadow: the sun's path on the water, the swell -->
<g fill="#ffe3a0" filter="url(#soft)"><rect x="40" y="71" width="40" height="3.4" rx="1.7"/><rect x="45" y="79" width="30" height="3" rx="1.5" opacity=".8"/><rect x="51" y="87" width="18" height="2.6" rx="1.3" opacity=".6"/></g>
<path d="M14 100c8-5 14-5 22 0s14 5 22 0 14-5 22 0 14 5 22 0" fill="none" stroke="#7fcfc8" stroke-width="3" stroke-linecap="round" opacity=".6"/>
<rect y="66" width="120" height="2" fill="#fff" opacity=".35"/>
</svg>
